<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7047d9"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.png"><title>Color Recipe Book</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f9;color:#242433;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{background:#7047d9;color:white;padding:18px 16px}header h1{font-size:23px;margin:0}header p{margin:5px 0 0;font-size:13px;opacity:.9}main{max-width:850px;margin:auto;padding:14px}button{border:0;border-radius:10px;background:#7047d9;color:white;font:inherit;font-weight:600;padding:11px 13px;cursor:pointer}button.secondary{background:#eae5fb;color:#4d2d9c}button.danger{background:#fce5e5;color:#9d2525}input,textarea,select{width:100%;border:1px solid #d9d9e2;border-radius:10px;background:white;padding:11px;font:inherit;min-width:0}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.toolbar input{flex:1;min-width:180px}.card{background:white;border:1px solid #e2e2eb;border-radius:15px;padding:15px;margin:12px 0}.name{font-size:18px;font-weight:700}.muted{color:#707080;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.hidden{display:none!important}label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mix{border:1px solid #e1ddec;padding:10px;border-radius:12px;margin:8px 0}.mixgrid{display:grid;grid-template-columns:1fr 90px 90px;gap:7px}.recipe{border-top:1px solid #eee;padding:12px 0}.total{font-weight:700;text-align:right;margin:10px 0}.notice{font-size:12px;color:#666;line-height:1.5}dialog{border:0;border-radius:16px;padding:0;width:min(94vw,680px);max-height:90dvh;box-shadow:0 12px 40px #0004}dialog::backdrop{background:#0008}.dialogbody{padding:16px;overflow:auto;max-height:90dvh}dialog h2{margin:0 0 10px;font-size:21px}@media(max-width:480px){.row,.mixgrid{grid-template-columns:1fr}.toolbar button{flex:1}}
</style></head><body><header><h1>🎨 Color Recipe Book</h1><p>Клиенты и рецепты окрашивания</p></header><main><div class="toolbar"><input id="search" placeholder="Поиск по ФИО и телефону"><button id="addClient">＋ Новый клиент</button></div><div class="toolbar"><select id="sort"><option value="alpha">По алфавиту</option><option value="recent">Сначала изменённые</option><option value="fav">Избранные первыми</option></select><button class="secondary" id="export">Экспорт</button><button class="secondary" id="import">Импорт</button><input type="file" id="file" accept="application/json,.json" class="hidden"></div><div id="count" class="muted"></div><div id="list"></div><p class="notice">Записи хранятся только в этом приложении на iPhone. Регулярно делайте «Экспорт» для резервной копии. Не очищайте данные сайта без копии.</p></main><dialog id="editor"><div class="dialogbody"><h2 id="title">Новый клиент</h2><form id="form"><div class="row"><div><label for="last">Фамилия *</label><input id="last" required></div><div><label for="first">Имя</label><input id="first"></div></div><div class="row"><div><label for="middle">Отчество</label><input id="middle"></div><div><label for="phone">Телефон</label><input id="phone" type="tel"></div></div><label for="notes">Заметки</label><textarea id="notes" rows="2"></textarea><h3>История окрашиваний</h3><div id="recipes"></div><button type="button" class="secondary" id="addRecipe">＋ Добавить окрашивание</button><div class="actions"><button type="submit">Сохранить клиента</button><button type="button" class="secondary" id="cancel">Отмена</button></div></form></div></dialog><script>
(function(){'use strict';const KEY='color-recipe-book-local-v3';const $=id=>document.getElementById(id);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};let clients=[],editing=null,draft=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))clients=v}catch(e){alert('Ошибка чтения сохранённых данных')}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(clients));return true}catch(e){alert('Не удалось сохранить данные. Проверьте память iPhone.');return false}}
function fullname(c){return [c.last,c.first,c.middle].filter(Boolean).join(' ')}
function render(){const q=$('search').value.trim().toLocaleLowerCase('ru');let a=clients.filter(c=>(fullname(c)+' '+(c.phone||'')).toLocaleLowerCase('ru').includes(q));const sort=$('sort').value;a.sort((x,y)=>sort==='recent'?(y.updated||'').localeCompare(x.updated||''):sort==='fav'?(Number(y.fav)-Number(x.fav))||fullname(x).localeCompare(fullname(y),'ru'):fullname(x).localeCompare(fullname(y),'ru'));$('count').textContent='Клиентов: '+clients.length+' · Найдено: '+a.length;$('list').innerHTML=a.length?a.map(c=>{const r=(c.recipes||[]).slice().sort((x,y)=>y.date.localeCompare(x.date));return '<article class="card"><div class="name">'+esc(fullname(c))+(c.fav?' ⭐':'')+'</div><div>'+esc(c.phone||'Телефон не указан')+'</div><div class="muted">Окрашиваний: '+r.length+'</div>'+(c.notes?'<p>'+esc(c.notes)+'</p>':'')+(r.length?'<details><summary>История окрашиваний</summary>'+r.map(v=>'<div class="recipe"><b>'+esc(v.date)+'</b><div>'+v.mix.map(m=>esc(m.brand)+' · '+esc(m.oxide)+'% · '+esc(m.grams)+' г').join('<hr>')+'</div><b>Всего: '+v.mix.reduce((s,m)=>s+(Number(m.grams)||0),0).toFixed(1)+' г</b><p>'+esc(v.notes||'')+'</p></div>').join('')+'</details>':'')+'<div class="actions"><button data-edit="'+c.id+'">Открыть / изменить</button><button class="secondary" data-fav="'+c.id+'">'+(c.fav?'★ Убрать':'☆ Избранное')+'</button><button class="danger" data-delete="'+c.id+'">Удалить</button></div></article>'}).join(''):'<div class="card muted">Пока нет клиентов. Нажмите «＋ Новый клиент».</div>'}
function newRecipe(){return {id:uid(),date:today(),notes:'',mix:[{brand:'',oxide:'',grams:''}]}}
function open(id){editing=id||null;const c=clients.find(x=>x.id===id);$('title').textContent=c?'Редактирование клиента':'Новый клиент';$('last').value=c?.last||'';$('first').value=c?.first||'';$('middle').value=c?.middle||'';$('phone').value=c?.phone||'';$('notes').value=c?.notes||'';draft=JSON.parse(JSON.stringify(c?.recipes||[]));renderRecipes();$('editor').showModal()}
function collect(){draft.forEach(r=>{const root=$('recipes');r.date=root.querySelector('[data-date="'+r.id+'"]')?.value||r.date;r.notes=root.querySelector('[data-note="'+r.id+'"]')?.value||'';r.mix=r.mix.map((m,i)=>({brand:root.querySelector('[data-brand="'+r.id+'_'+i+'"]')?.value||'',oxide:root.querySelector('[data-oxide="'+r.id+'_'+i+'"]')?.value||'',grams:root.querySelector('[data-grams="'+r.id+'_'+i+'"]')?.value||''}))})}
function renderRecipes(){$('recipes').innerHTML=draft.map((r,i)=>'<div class="mix"><div class="actions"><b>Окрашивание '+(i+1)+'</b><button type="button" class="danger" data-remover="'+r.id+'">Удалить</button></div><label>Дата</label><input type="date" data-date="'+r.id+'" value="'+esc(r.date)+'"><label>Красители</label>'+r.mix.map((m,j)=>'<div class="mixgrid" style="margin-bottom:7px"><input placeholder="Краситель" data-brand="'+r.id+'_'+j+'" value="'+esc(m.brand)+'"><input placeholder="Оксид %" inputmode="decimal" data-oxide="'+r.id+'_'+j+'" value="'+esc(m.oxide)+'"><input placeholder="Граммы" inputmode="decimal" data-grams="'+r.id+'_'+j+'" value="'+esc(m.grams)+'"></div>').join('')+'<button type="button" class="secondary" data-addmix="'+r.id+'">＋ Краситель</button><label>Заметки к окрашиванию</label><textarea rows="2" data-note="'+r.id+'">'+esc(r.notes)+'</textarea></div>').join('')}
$('addClient').addEventListener('click',()=>open(null));$('cancel').addEventListener('click',()=>$('editor').close());$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('addRecipe').addEventListener('click',()=>{collect();draft.push(newRecipe());renderRecipes()});$('recipes').addEventListener('click',e=>{const b=e.target;if(b.dataset.remover){collect();draft=draft.filter(r=>r.id!==b.dataset.remover);renderRecipes()}if(b.dataset.addmix){collect();draft.find(r=>r.id===b.dataset.addmix).mix.push({brand:'',oxide:'',grams:''});renderRecipes()}});
$('form').addEventListener('submit',e=>{e.preventDefault();collect();const old=clients.find(c=>c.id===editing);const c={id:editing||uid(),last:$('last').value.trim(),first:$('first').value.trim(),middle:$('middle').value.trim(),phone:$('phone').value.trim(),notes:$('notes').value.trim(),fav:old?.fav||false,recipes:draft,updated:new Date().toISOString()};if(!c.last){alert('Введите фамилию');return}const next=old?clients.map(x=>x.id===editing?c:x):[...clients,c];const prev=clients;clients=next;if(persist()){$('editor').close();render()}else clients=prev});$('list').addEventListener('click',e=>{const b=e.target;if(b.dataset.edit)open(b.dataset.edit);if(b.dataset.fav){const c=clients.find(x=>x.id===b.dataset.fav);c.fav=!c.fav;if(persist())render()}if(b.dataset.delete&&confirm('Удалить клиента и всю историю окрашиваний?')){clients=clients.filter(x=>x.id!==b.dataset.delete);if(persist())render()}});
$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(clients,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ColorRecipeBook_backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)});$('import').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const val=JSON.parse(await file.text());if(!Array.isArray(val))throw Error();if(confirm('Импорт заменит все текущие записи. Продолжить?')){const prev=clients;clients=val;if(persist())render();else clients=prev}}catch(e){alert('Неверный файл резервной копии')}e.target.value=''});render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
